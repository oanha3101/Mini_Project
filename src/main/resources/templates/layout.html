<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; color: #333; }
        .navbar { background-color: #2c3e50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: white; font-size: 1.3rem; }
        .navbar nav a { color: #ecf0f1; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
        .navbar nav a:hover { color: #3498db; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1rem; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1rem; border: 1px solid #f5c6cb; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #2c3e50; color: white; font-weight: 600; }
        tr:hover { background-color: #f8f9fa; }
        .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .page-header h2 { color: #2c3e50; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; color: #2c3e50; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,0.2); }
        .form-group .error { color: #e74c3c; font-size: 0.85rem; margin-top: 0.2rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .search-form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .search-form input { flex: 1; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        .empty-state { text-align: center; padding: 3rem; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏢 Employee Management</h1>
        <nav>
            <a th:href="@{/employees/list}">📋 Employee List</a>
            <a th:href="@{/employees/add}">➕ Add Employee</a>
            <a th:href="@{/employees/search}">🔍 Search</a>
        </nav>
    </div>
    <div class="container" th:fragment="content">
        <!-- Content will be inserted by child templates -->
    </div>
</body>
</html>
