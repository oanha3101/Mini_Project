<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Employees</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; color: #333; }
        .navbar { background-color: #2c3e50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: white; font-size: 1.3rem; }
        .navbar nav a { color: #ecf0f1; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
        .navbar nav a:hover { color: #3498db; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .page-header h2 { color: #2c3e50; margin-bottom: 1.5rem; }
        .search-form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .search-form input { flex: 1; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        .search-form input:focus { outline: none; border-color: #3498db; }
        .btn { display: inline-block; padding: 0.6rem 1.2rem; border-radius: 4px; text-decoration: none; font-size: 0.95rem; cursor: pointer; border: none; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #2c3e50; color: white; font-weight: 600; }
        tr:hover { background-color: #f8f9fa; }
        .result-info { margin-bottom: 1rem; color: #7f8c8d; }
        .empty-state { text-align: center; padding: 3rem; color: #7f8c8d; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏢 Employee Management</h1>
        <nav>
            <a th:href="@{/employees/list}">📋 Employee List</a>
            <a th:href="@{/employees/add}">➕ Add Employee</a>
            <a th:href="@{/employees/search}">🔍 Search</a>
        </nav>
    </div>

    <div class="container">
        <div class="page-header">
            <h2>Search Employees</h2>
        </div>

        <form th:action="@{/employees/search}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name or department..." />
            <button type="submit" class="btn btn-primary">🔍 Search</button>
        </form>

        <div th:if="${keyword != null and employees != null}">
            <p class="result-info">
                Found <strong th:text="${#lists.size(employees)}"></strong> result(s) for
                "<span th:text="${keyword}"></span>"
            </p>

            <div th:if="${#lists.isEmpty(employees)}" class="empty-state">
                <p>No employees found matching your search criteria.</p>
            </div>

            <table th:unless="${#lists.isEmpty(employees)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Employee Code</th>
                        <th>Full Name</th>
                        <th>Department</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="employee : ${employees}">
                        <td th:text="${employee.id}"></td>
                        <td th:text="${employee.employeeCode}"></td>
                        <td th:text="${employee.fullName}"></td>
                        <td th:text="${employee.department}"></td>
                        <td th:text="${employee.email}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${keyword == null}" class="empty-state">
            <p>Enter a keyword to search employees by name or department.</p>
        </div>
    </div>
</body>
</html>
