<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Statistics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; color: #333; }
        .navbar { background-color: #2c3e50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: white; font-size: 1.3rem; }
        .navbar nav a { color: #ecf0f1; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
        .navbar nav a:hover { color: #3498db; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .page-header h2 { color: #2c3e50; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: inline-block; margin-right: 1rem; margin-bottom: 1rem; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #3498db; }
        .stat-label { color: #7f8c8d; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 1rem; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #2c3e50; color: white; font-weight: 600; }
        tr:hover { background-color: #f8f9fa; }
        .empty-state { text-align: center; padding: 3rem; color: #7f8c8d; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-group { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏢 Employee Management</h1>
        <nav>
            <a th:href="@{/employees/list}">📋 Employee List</a>
            <a th:href="@{/employees/add}">➕ Add Employee</a>
            <a th:href="@{/employees/search}">🔍 Search</a>
            <a th:href="@{/employees/statistics}">📊 Statistics</a>
        </nav>
    </div>

    <div class="container">
        <div class="page-header">
            <h2>Employee Statistics</h2>
            <div class="btn-group">
                <a th:href="@{/employees/list}" class="btn btn-primary">← Back to List</a>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-value" th:text="${total}">0</div>
            <div class="stat-label">Total Employees</div>
        </div>

        <div th:if="${#lists.isEmpty(byDepartment)}" class="empty-state">
            <p>No employees found. Add some employees first to see statistics.</p>
        </div>

        <table th:unless="${#lists.isEmpty(byDepartment)}">
            <thead>
                <tr>
                    <th>Department</th>
                    <th>Number of Employees</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stat : ${byDepartment}">
                    <td th:text="${stat.department}"></td>
                    <td th:text="${stat.count}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
