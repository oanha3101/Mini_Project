<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; color: #333; }
        .navbar { background-color: #2c3e50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: white; font-size: 1.3rem; }
        .navbar nav a { color: #ecf0f1; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
        .navbar nav a:hover { color: #3498db; }
        .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .page-header h2 { color: #2c3e50; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; color: #2c3e50; }
        .form-group input { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,0.2); }
        .form-group .error { color: #e74c3c; font-size: 0.85rem; margin-top: 0.2rem; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1rem; border: 1px solid #f5c6cb; }
        .btn { display: inline-block; padding: 0.6rem 1.5rem; border-radius: 4px; text-decoration: none; font-size: 0.95rem; cursor: pointer; border: none; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #95a5a6; color: white; margin-left: 0.5rem; }
        .btn-secondary:hover { background-color: #7f8c8d; }
        .btn-group { margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏢 Employee Management</h1>
        <nav>
            <a th:href="@{/employees/list}">📋 Employee List</a>
            <a th:href="@{/employees/add}">➕ Add Employee</a>
            <a th:href="@{/employees/search}">🔍 Search</a>
        </nav>
    </div>

    <div class="container">
        <div class="card">
            <div class="page-header">
                <h2>Add New Employee</h2>
            </div>

            <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

            <form th:action="@{/employees/add}" th:object="${employeeRequest}" method="post">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" placeholder="Enter full name" />
                    <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" th:field="*{department}" placeholder="Enter department" />
                    <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="Enter email address" />
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">💾 Save Employee</button>
                    <a th:href="@{/employees/list}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
